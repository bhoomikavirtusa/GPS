ontemplated under this Agreement, including but not limited to the validity of this arbitration clause or any copyright infringement claims arising out of Wiley's use of any Licensed Materials licensed hereunder, shall be resolved by binding arbitration by the American Arbitration Association, under the Arbitration Rules then in effect, in New York, New York. Any award of the arbitrator(s) may be entered as a judgment in any court of competent jurisdiction. This Agreement shall be interpreted under the Federal Arbitration Act and the laws of the State of New York, without regard to such State's conflict of law rules. Neither party shall be entitled to recover its costs or attorneys fees.
