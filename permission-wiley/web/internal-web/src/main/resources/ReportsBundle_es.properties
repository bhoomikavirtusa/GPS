pr.text3=Por favor, le ruego firme esta carta para expresar su conformidad con los términos descritos en la presente. Una vez firmada, efectúe la devolución la misma a través de correo electrónico o de correo ordinario a la dirección que se indica a continuación. Con su firma, usted también está garantizando que las imágenes no infringen o violan ningún derecho de autor, derecho de privacidad o cualquier otra información confidencial o personal, y que no contienen ningún contenido difamatorio o de alguna manera ilegal. De la misma manera, al firmar, usted acepta indemnizarnos y eximirnos de toda responsabilidad, tanto a nosotros como a nuestros cesionarios y nuestros licenciatarios reconociendonos como inofensivos. 
pr.text4=Si usted no está al cargo de estos derechos en su totalidad, por favor remítame a la persona adecuada.
