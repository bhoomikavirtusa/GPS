amendment.text.1=No obstante lo anterior, Wiley y licenciador de acuerdo en que sería impracticable y extremadamente difícil determinar la cantidad de los daños reales causados ??por el uso de cualquier Material Autorizado con licencia aquí sobre y afuera el alcance de la licencia otorgada. Por lo tanto, Wiley y el licenciador stan de acuerdo en que, en el caso de cualquiera reclamación que surja de la utilización de los materiales en esta licencia afuera de los derechos otorgados (por ejemplo, a modo de ilustración y no de limitación, el uso en exceso de la cantidad tirada y especificada anteriormente), el único y exclusivo recurso del Licenciatario será el pago de cantidad igual a la cantidad aplicable indicada anteriormente si acaso Wiley es autorizado el uso, el aumento proporcional basado en el uso real por Wiley. Por ejemplo, si el uso de Wiley es 5% superior a la limitación de la tirada, la cuota que deberá pagarse al Licenciante bajo esta cláusula se establece la tarifa de licencia actual indicada anteriormente para dicho uso se incrementó en un 5%. Si el presente Convenio no establece una tasa aplicable que equivale a dicho uso, la tasa será la tasa máxima establecida en este Acuerdo. Wiley y el Licenciante acuerdan además que las tasas calculadas de conformidad con este párrafo representan una compensación razonable por la pérdida sufrida por el licenciador debido al uso de materiales con licencia fuera del alcance de los derechos otorgados por el presente Acuerdo. Las partes renuncian expresamente a cualquier reclamación por daños y perjuicios legales y honorarios de abogados \n\nEn caso de reclamación, disputa o diferencia de cualquier naturaleza deberán surgir entre Wiley y el Licenciante o cualquier agente, empleado, sucesor, o de cualquiera de las partes (una "Disputa") en conexión con relación a, o que surja de este Acuerdo, las partes intentarán resolver tales controversias en primera instancia por negociación mutua. Si la controversia no ha sido resuelta mediante negociaciones dentro de los treinta (30) días, las partes acuerdan que cualquier conflicto, ya sea en relación con este Acuerdo o de otra manera, y cualquier disputa relacionada con este Acuerdo o la relación o deberes previstos en el presente Acuerdo, incluyendo pero no se limita a la validez de esta cláusula de arbitraje o cualquier infracción de derechos de autor sostiene que surja del uso de Wiley de los Materiales bajo licencia objeto de la misma, será resuelta mediante arbitraje obligatorio por la Asociación Americana de Arbitraje, de conformidad con las Reglas de Arbitraje vigentes en ese momento, en Nueva York, Nueva York. El laudo del árbitro(s) puede ser introducido como sentencia en cualquier tribunal de jurisdicción competente. Este Acuerdo se interpretará conforme a la Ley Federal de Arbitraje y las leyes del Estado de Nueva York, sin tener en cuenta conflictos de ese Estado de leyes. Ninguna de las partes tendrá derecho a recuperar los costos u honorarios profesionales.
