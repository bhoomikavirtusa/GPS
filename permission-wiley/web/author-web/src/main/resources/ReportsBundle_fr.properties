amendment.text.1=Notwithstanding the foregoing, Wiley and Licensor agree that it would be impracticable and extremely difficult to ascertain the amount of actual damages caused by use of any Licensed Materials licensed hereunderoutside the scope of the license granted.  Therefore, Wiley and Licensor agree that, in the event of any claim arising out of the use of the Licensed Materials licensed hereunder outside the scope of the rights granted (for example, by way of illustration and not limitation, a use in excess of the print run amount specified above), Licensor's sole and exclusive remedy shall be payment of a fee equal to the applicable fee set forth above had Wiley licensed the use, increased pro rata based upon the actual use by Wiley. For example, if Wiley's use is 5% in excess of the print run limitation, the fee that shall be due to Licensor under this clause is the actual license fee set forth above for said use increased by 5%. If this Agreement does not set forth an applicable fee that equates to said use, the fee shall be the highest fee set forth in this Agreement. Wiley and Licensor further agree that fees calculated in accordance with this Paragraph represent reasonable compensation for the loss incurred by Licensor due to use of Licensed Materials outside the scope of the rights granted by this Agreement.  The parties expressly waive any claims for statutory damages and attorneys' fees.\n\nIf a claim, dispute or difference of any kind whatsoever  shall arise between Wiley and Licensor or any agent, employee, successor, or assign of either party (a \"Dispute\") in connection with, relating to, or arising out of this Agreement, the parties shall attempt to settle such Dispute in the first instance by mutual negotiation. If such Dispute has not been resolved by negotiation within thirty (30) days, the parties agree that any Dispute, whether related to this Agreement or otherwise, and any Dispute related to this Agreement or the relationship or duties contemplated under this Agreement, including but not limited to the validity of this arbitration clause or any copyright infringement claims arising out of Wiley's use of any Licensed Materials licensed hereunder, shall be resolved by binding arbitration by the American Arbitration Association, under the Arbitration Rules then in effect, in New York, New York. Any award of the arbitrator(s) may be entered as a judgment in any court of competent jurisdiction. This Agreement shall be interpreted under the Federal Arbitration Act and the laws of the State of New York, without regard to such State's conflict of law rules. Neither party shall be entitled to recover its costs or attorneys fees.
